# Default values for todo-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  daprEnabled: true

image:
  backend:
    repository: todo-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  frontend:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  notification:
    repository: todo-notification
    pullPolicy: IfNotPresent
    tag: "latest"
  recurring:
    repository: todo-recurring
    pullPolicy: IfNotPresent
    tag: "latest"
  websocket:
    repository: todo-websocket
    pullPolicy: IfNotPresent
    tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  backend:
    type: ClusterIP
    port: 80
  frontend:
    type: LoadBalancer
    port: 80
  notification:
    type: ClusterIP
    port: 80
  recurring:
    type: ClusterIP
    port: 80
  websocket:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Kafka configuration
kafka:
  enabled: true
  broker: "my-cluster-kafka-brokers.kafka.svc.cluster.local:9092"

# PostgreSQL configuration
postgresql:
  enabled: true
  host: "postgres"
  port: 5432
  database: "todo_db"
  username: "user"

# Redis configuration
redis:
  enabled: true
  host: "redis-master"
  port: 6379