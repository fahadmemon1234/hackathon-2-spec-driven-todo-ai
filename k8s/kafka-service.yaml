apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: todo-app
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: kafka-internal
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: kafka-external
      protocol: TCP
      port: 29092
      targetPort: 29092
  type: ClusterIP