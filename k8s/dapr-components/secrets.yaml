apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: local-secret-store
  namespace: todo-app
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  - name: secretsFile
    value: "/secrets/secrets.json"
  - name: nestedSeparator
    value: ":"
  - name: enableBase64Encoding
    value: "false"