apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "backend-service"
        dapr.io/app-port: "8000"
        dapr.io/config: "dapr-config"
        dapr.io/components: "kafka-pubsub,statestore,local-secret-store"
    spec:
      containers:
      - name: backend
        image: todo-app-backend:minikube
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://user:password@postgres:5432/todo_db"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_STATE_STORE_NAME
          value: "statestore"
        - name: DAPR_PUBSUB_NAME
          value: "kafka-pubsub"
        volumeMounts:
        - name: components-volume
          mountPath: /components
      volumes:
      - name: components-volume
        hostPath:
          path: /components
          type: Directory