apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../base

patchesStrategicMerge:
- patch-backend-production.yaml
- patch-frontend-production.yaml

images:
- name: todo-backend
  newName: todo-backend
  newTag: production
- name: todo-frontend
  newName: todo-frontend
  newTag: production

configMapGenerator:
- name: production-config
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=info
  - ENABLE_METRICS=true
  - METRICS_PORT=8080

secretGenerator:
- name: production-secrets
  literals:
  - DB_PASSWORD=prod-secret-password
  - API_KEY=prod-api-key
  - KAFKA_SASL_JAAS_CONFIG=prod-kafka-config