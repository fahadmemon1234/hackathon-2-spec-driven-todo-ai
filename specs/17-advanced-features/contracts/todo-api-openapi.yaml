openapi: 3.0.3
info:
  title: Todo API with Advanced Features
  description: API for managing tasks with priority, tags, due dates, and recurring tasks
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.todoapp.com
    description: Production server

paths:
  /api/{user_id}/tasks:
    get:
      summary: List tasks with advanced filtering and sorting
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
        - name: priority
          in: query
          required: false
          description: Comma-separated list of priorities to filter by
          schema:
            type: string
            example: "high,urgent"
        - name: tags
          in: query
          required: false
          description: Comma-separated list of tags to filter by
          schema:
            type: string
            example: "work,personal"
        - name: q
          in: query
          required: false
          description: Keyword to search in title and description
          schema:
            type: string
            example: "meeting"
        - name: sort
          in: query
          required: false
          description: Comma-separated fields to sort by (prefix with - for descending)
          schema:
            type: string
            example: "priority,-due_date,title,created_at"
        - name: due_after
          in: query
          required: false
          description: Filter tasks with due date after this date
          schema:
            type: string
            format: date
            example: "2026-01-20"
        - name: due_before
          in: query
          required: false
          description: Filter tasks with due date before this date
          schema:
            type: string
            format: date
            example: "2026-01-30"
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task with advanced features
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /api/{user_id}/tasks/{task_id}:
    get:
      summary: Get a specific task
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
    put:
      summary: Update a task with advanced features
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
    delete:
      summary: Delete a task
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          description: Task identifier
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - user_id
        - title
        - completed
        - priority
        - tags
        - is_recurring
      properties:
        id:
          type: integer
          description: Unique identifier for the task
          example: 123
        user_id:
          type: string
          description: User identifier
          example: "user-uuid-123"
        title:
          type: string
          description: Title of the task
          example: "Prepare presentation"
        description:
          type: string
          description: Detailed description of the task
          example: "Prepare slides for the quarterly meeting"
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        priority:
          type: string
          enum: [low, medium, high, urgent]
          description: Priority level of the task
          example: "high"
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the task
          example: ["work", "important"]
        due_date:
          type: string
          format: date-time
          description: When the task should be completed
          example: "2026-01-20T18:00:00Z"
        is_recurring:
          type: boolean
          description: Whether the task repeats
          example: false
        recurrence_rule:
          type: string
          description: Rule defining how the task recurs
          example: "FREQ=WEEKLY;BYDAY=MO,WE"
        next_occurrence:
          type: string
          format: date-time
          description: When the next instance of a recurring task is due
          example: "2026-01-22T09:00:00Z"
        created_at:
          type: string
          format: date-time
          description: When the task was created
          example: "2026-01-18T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
          example: "2026-01-18T15:45:00Z"

    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Title of the task
          example: "Prepare presentation"
        description:
          type: string
          description: Detailed description of the task
          example: "Prepare slides for the quarterly meeting"
        priority:
          type: string
          enum: [low, medium, high, urgent]
          description: Priority level of the task
          default: "medium"
          example: "high"
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the task
          example: ["work", "important"]
        due_date:
          type: string
          format: date-time
          description: When the task should be completed
          example: "2026-01-20T18:00:00Z"
        is_recurring:
          type: boolean
          description: Whether the task repeats
          default: false
          example: false
        recurrence_rule:
          type: string
          description: Rule defining how the task recurs
          example: "FREQ=WEEKLY;BYDAY=MO,WE"

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the task
          example: "Prepare presentation"
        description:
          type: string
          description: Detailed description of the task
          example: "Prepare slides for the quarterly meeting"
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        priority:
          type: string
          enum: [low, medium, high, urgent]
          description: Priority level of the task
          example: "high"
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the task
          example: ["work", "important"]
        due_date:
          type: string
          format: date-time
          description: When the task should be completed
          example: "2026-01-20T18:00:00Z"
        is_recurring:
          type: boolean
          description: Whether the task repeats
          example: false
        recurrence_rule:
          type: string
          description: Rule defining how the task recurs
          example: "FREQ=WEEKLY;BYDAY=MO,WE"
        next_occurrence:
          type: string
          format: date-time
          description: When the next instance of a recurring task is due
          example: "2026-01-22T09:00:00Z"