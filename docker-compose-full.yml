version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_Lvigx2SDY1ba@ep-billowing-violet-a4n2y54m-pooler.us-east-1.aws.neon.tech/Todo?sslmode=require&channel_binding=require
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - kafka
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
      ENVIRONMENT: development
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - app-network

  notification:
    build:
      context: .
      dockerfile: Dockerfile.notification
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/todo_db
      KAFKA_BROKERS: kafka:9092
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - app-network

  recurring:
    build:
      context: .
      dockerfile: Dockerfile.recurring
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/todo_db
      KAFKA_BROKERS: kafka:9092
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge