services:
  dapr-placement:
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]
    ports:
      - "50005:50005"
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_Lvigx2SDY1ba@ep-billowing-violet-a4n2y54m-pooler.us-east-1.aws.neon.tech/Todo?sslmode=require&channel_binding=require
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - kafka
    networks:
      - app-network
    # Mount components directory for Dapr
    volumes:
      - ./components:/components

  dapr-sidecar:
    image: daprio/dapr:latest
    command: ["./daprd",
      "--app-id", "backend-service",
      "--app-port", "8000",
      "--app-protocol", "http",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "dapr-placement:50005",
      "--resources-path", "/components",
      "--config", "/dapr-config.yaml",
      "--log-level", "debug",
      "--enable-api-logging",
      "--app-channel-address", "backend"]
    ports:
      - "3500:3500"
      - "50001:50001"
    depends_on:
      - backend
      - dapr-placement
      - kafka  # Add dependency on kafka to ensure it's ready
    networks:
      - app-network
    volumes:
      - ./components:/components
      - ./secrets:/secrets
      - ./dapr-config.yaml:/dapr-config.yaml

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8080
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
      - websocket-service
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Kafka listeners - define both PLAINTEXT and PLAINTEXT_HOST
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092

      # Advertise both internal and external addresses
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

      # Map listener names to protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/websocket_service.py
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://user:password@db:5432/todo_db
    depends_on:
      - kafka
      - db
    networks:
      - app-network

  recurring-consumer:
    build:
      context: .
      dockerfile: Dockerfile.recurring
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/todo_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - db
      - kafka
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
