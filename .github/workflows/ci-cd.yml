name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stop for any linting errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
        
    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
        
    - name: Build and push notification service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.notification
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-notification:latest
        
    - name: Build and push recurring task service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.recurring
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-recurring:latest
        
    - name: Build and push websocket service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.websocket
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-websocket:latest

  deploy-minikube:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set up Docker
      uses: docker/setup-docker-action@v1
      
    - name: Start Minikube
      uses: medyagh/setup-minikube@master
      with:
        minikube-version: 'latest'
        kubernetes-version: 'v1.28.3'
        
    - name: Install Dapr
      run: |
        wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash
        dapr init -k
        
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
        
    - name: Deploy to Minikube
      run: |
        helm install todo-release ./helm/todo-app \
          --set image.backend.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-backend \
          --set image.backend.tag=latest \
          --set image.frontend.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend \
          --set image.frontend.tag=latest \
          --set image.notification.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-notification \
          --set image.notification.tag=latest \
          --set image.recurring.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-recurring \
          --set image.recurring.tag=latest \
          --set image.websocket.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-websocket \
          --set image.websocket.tag=latest

  deploy-aks:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set up Docker
      uses: docker/setup-docker-action@v1
      
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
        
    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_CLUSTER_NAME }}
        
    - name: Install Dapr on AKS
      run: |
        kubectl apply -f https://raw.githubusercontent.com/dapr/dapr/v1.12.0/releases/release-v1.12.0.yaml
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=dapr-operator --timeout=300s -n dapr-system
        
    - name: Deploy to AKS
      run: |
        helm upgrade --install todo-release ./helm/todo-app \
          --set image.backend.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-backend \
          --set image.backend.tag=latest \
          --set image.frontend.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend \
          --set image.frontend.tag=latest \
          --set image.notification.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-notification \
          --set image.notification.tag=latest \
          --set image.recurring.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-recurring \
          --set image.recurring.tag=latest \
          --set image.websocket.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-websocket \
          --set image.websocket.tag=latest \
          --namespace todo-app --create-namespace